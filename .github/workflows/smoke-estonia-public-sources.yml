name: Smoke Estonia Public Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check audited public sources
        run: python3 scripts/smoke_estonia_public_sources.py
